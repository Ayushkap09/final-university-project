<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - U-WRS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Login</h2>

        <div th:if="${flashSuccess}" class="flash flash-success" th:text="${flashSuccess}"></div>
        <div th:if="${param.error}" class="flash flash-error">Invalid email or password.</div>
        <div th:if="${param.logout}" class="flash flash-success">You have been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Register</a>
        </div>
    </div>
</div>

</body>
</html>
