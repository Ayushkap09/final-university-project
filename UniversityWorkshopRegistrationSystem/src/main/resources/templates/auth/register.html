<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - U-WRS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>

        <form th:action="@{/register}" th:object="${userForm}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control">
                <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">name err</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control">
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">email err</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control">
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">pw err</div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a th:href="@{/login}">Login</a>
        </div>
    </div>
</div>

</body>
</html>
