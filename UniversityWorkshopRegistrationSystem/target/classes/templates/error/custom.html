<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - U-WRS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="error-page">
        <p class="error-code" th:text="${errorCode}">500</p>
        <p class="error-message" th:text="${errorMessage}">An error occurred</p>
        <a th:href="@{/}" class="btn btn-primary">Go to Home</a>
    </div>
</div>

</body>
</html>
